name: Deploy to Oracle Cloud VPS

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md" # Don't redeploy if the changes are only in markdown files

concurrency:
  group: yahtzee-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/hosting/yahtzee
            git pull --ff-only
            docker compose build
            docker compose up -d
